[versions]
minecraft = "1.21.4"
kotlin = "2.4.0"
lapis = "0.10.0-SNAPSHOT"

fabric-loom = "1.9-SNAPSHOT"
fabric-loader = "0.19.5"
fabric-kotlin = "1.13.12+kotlin.2.4.0"
fabric-yarn = "1.21.4+build.8"
fabric-api = "0.119.4+1.21.4"

toml = "0.7.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
